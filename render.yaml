# One-click deploy on Render (Blueprint). Persistent disk keeps the SQLite DB across deploys.
services:
  - type: web
    name: sentineltrace
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: API_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: BEHIND_PROXY
        value: "1"
